<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ari</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- 메인 콘텐츠 영역 -->
    <main id="main-content">
      
      <!-- 1. 홈 탭 -->
      <section id="tab-home" class="tab-content active">
        <h1 class="page-title">홈</h1>
        <div class="card">
          <p class="greeting">오늘도 좋은 하루 보내세요! ✨</p>
        </div>
      </section>

      <!-- 2. 시간표 탭 -->
      <section id="tab-schedule" class="tab-content">
        <h1 class="page-title">시간표</h1>
        <div class="card" id="schedule-container">
          <p style="color: var(--text-sub); text-align: center; padding: 20px 0;">시간표를 불러오는 중입니다...</p>
        </div>
      </section>

      <!-- 3. 급식 탭 (중식/석식 구분) -->
      <section id="tab-meal" class="tab-content">
        <h1 class="page-title">오늘의 급식</h1>
        <div class="meal-grid">
          <div class="meal-card">
            <div class="meal-header">
              <i data-lucide="sun"></i>
              <h3>중식</h3>
            </div>
            <ul id="lunch-list" class="meal-list">
              <li>불러오는 중...</li>
            </ul>
          </div>
          
          <div class="meal-card">
            <div class="meal-header">
              <i data-lucide="moon"></i>
              <h3>석식</h3>
            </div>
            <ul id="dinner-list" class="meal-list">
              <li>불러오는 중...</li>
            </ul>
          </div>
        </div>
      </section>

      <!-- 4. 할 일 탭 -->
      <section id="tab-todo" class="tab-content">
        <h1 class="page-title">할 일</h1>
        <div class="todo-input-group">
          <input type="text" id="todo-input" placeholder="새로운 할 일 입력...">
          <button id="add-todo-btn"><i data-lucide="plus"></i></button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
      </section>

    </main>

    <!-- 하단 탭 바 (노션 스타일 아웃라인 아이콘) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="tab-home">
        <i data-lucide="home"></i>
        <span>홈</span>
      </button>
      <button class="nav-item" data-tab="tab-schedule">
        <i data-lucide="calendar"></i>
        <span>시간표</span>
      </button>
      <button class="nav-item" data-tab="tab-meal">
        <i data-lucide="utensils"></i>
        <span>급식</span>
      </button>
      <button class="nav-item" data-tab="tab-todo">
        <i data-lucide="check-square"></i>
        <span>할 일</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
