<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>ARIA</title>
<meta name="theme-color" content="#1F1F1E" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ARIA" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-title">
      <span class="brand-mark" aria-hidden="true">A</span>
      <div>
        <h1>ARIA</h1>
        <p id="today-label" class="topbar-date"></p>
      </div>
    </div>
    <button id="settings-btn" class="icon-btn" aria-label="설정" title="설정">⚙</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-view="home"><span class="tab-icon">🏠</span><span>홈</span></button>
    <button class="tab-btn" data-view="timetable"><span class="tab-icon">🗓</span><span>시간표</span></button>
    <button class="tab-btn" data-view="todo"><span class="tab-icon">✓</span><span>할일</span></button>
    <button class="tab-btn" data-view="notes"><span class="tab-icon">📝</span><span>노트</span></button>
    <button class="tab-btn" data-view="calendar"><span class="tab-icon">📅</span><span>캘린더</span></button>
  </nav>

</div>

<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
